# =======================================================================
# Configuracion comun a todos los hosts de la maqueta antes del hardening
# =======================================================================

- name: Cargar variables de la familia de sistema operativo
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  tags: always

# -------------------------------------------------------------
#  Identidad del host
# -------------------------------------------------------------

- name: Establecer el nombre del host
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}.{{ base_dominio }}"
  tags: [base, identidad]

- name: Asegurar la entrada propia en /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}.{{ base_dominio }} {{ inventory_hostname }}"
    state: present
  tags: [base, identidad]

# Resolucion temporal entre hosts (hasta poner freeipa)

- name: Publicar los hosts de la maqueta en /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} MAQUETA CDG (gestionado por Ansible, rol base)"
    block: |
      {% for h in groups['all'] | sort %}
      {{ hostvars[h].ansible_host | default('') }} {{ h }}.{{ base_dominio }} {{ h }}
      {% endfor %}
    state: "{{ 'present' if base_manage_hosts_file else 'absent' }}"
  tags: [base, identidad]

# -------------------------------------------------------------
#  Zona horaria
# -------------------------------------------------------------

- name: Configurar la zona horaria
  community.general.timezone:
    name: "{{ base_timezone }}"
  tags: [base, tiempo]

# -------------------------------------------------------------
#  Paquetes
# -------------------------------------------------------------

- name: Deshabilitar las actualizaciones automaticas
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - unattended-upgrades
    - apt-daily.timer
    - apt-daily-upgrade.timer
  failed_when: false
  when: ansible_os_family == "Debian"
  tags: always

- name: Esperar a que ningun otro proceso este usando apt
  ansible.builtin.shell:
    cmd: |
      for i in $(seq 1 60); do
        if flock -n /var/lib/dpkg/lock-frontend true 2>/dev/null \
           && flock -n /var/lib/apt/lists/lock true 2>/dev/null; then
          exit 0
        fi
        sleep 5
      done
      echo "apt sigue bloqueado tras 5 minutos" >&2
      exit 1
  changed_when: false
  when: ansible_os_family == "Debian"
  tags: always

- name: Actualizar el indice de paquetes
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 120
  when: ansible_os_family == "Debian"
  tags: always

- name: Instalar los paquetes comunes
  ansible.builtin.package:
    name: "{{ base_common_packages + base_extra_packages }}"
    state: present
  tags: [base, paquetes]

# -------------------------------------------------------------
#  NTP
# -------------------------------------------------------------

- name: Desplegar la configuracion de chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ base_chrony_conf }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: reiniciar chrony
  tags: [base, tiempo]

- name: Habilitar y arrancar chrony
  ansible.builtin.service:
    name: "{{ base_chrony_service }}"
    state: started
    enabled: true
  tags: [base, tiempo]

# Verificacion
- name: Consultar el estado de sincronizacion
  ansible.builtin.command:
    cmd: chronyc tracking
  register: base_chrony_tracking
  changed_when: false
  failed_when: false
  tags: [base, tiempo, verificacion]

- name: Mostrar la fuente de tiempo en uso
  ansible.builtin.debug:
    msg: "{{ base_chrony_tracking.stdout_lines | select('search', 'Reference ID|Stratum|System time') | list }}"
  when: base_chrony_tracking.rc == 0
  tags: [base, tiempo, verificacion]

- name: Advertir si chrony aun no sincronizo
  ansible.builtin.debug:
    msg: >-
      chrony todavia no reporta sincronizacion en {{ inventory_hostname }}.
      Es normal en los primeros minutos tras el arranque. Verificar con
      'chronyc sources -v' si persiste.
  when: base_chrony_tracking.rc != 0
  tags: [base, tiempo, verificacion]


- name: Impedir que el cliente DHCP de la interfaz NAT instale ruta por defecto
  ansible.builtin.template:
    src: dhclient-sin-ruta.j2
    dest: "{{ base_dhclient_hook }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - base_configurar_ruta_default
    - ansible_os_family == "Debian"
  tags: [base, red]

# Tarea para almalinux que no tiene dhclient
# obtiene nombre de int e impide que se instale ruta por defecto

- name: Obtener el nombre de la conexion de NetworkManager en la interfaz NAT
  ansible.builtin.shell:
    cmd: "nmcli -t -f NAME,DEVICE connection show | awk -F: '$2==\"{{ base_iface_nat }}\" {print $1}'"
  register: base_nm_conexion
  changed_when: false
  when:
    - base_configurar_ruta_default
    - ansible_os_family == "RedHat"
  tags: [base, red]

- name: Consultar si la conexion NAT ya esta marcada como never-default
  ansible.builtin.command:
    cmd: "nmcli -g ipv4.never-default connection show '{{ base_nm_conexion.stdout | trim }}'"
  register: base_nm_estado
  changed_when: false
  when:
    - base_configurar_ruta_default
    - ansible_os_family == "RedHat"
    - base_nm_conexion.stdout | trim | length > 0
  tags: [base, red]

- name: Impedir que NetworkManager instale ruta por defecto en la interfaz NAT
  ansible.builtin.command:
    cmd: "nmcli connection modify '{{ base_nm_conexion.stdout | trim }}' ipv4.never-default yes"
  when:
    - base_configurar_ruta_default
    - ansible_os_family == "RedHat"
    - base_nm_conexion.stdout | trim | length > 0
    - base_nm_estado.stdout | default('') | trim != "yes"
  tags: [base, red]

# -------------------------------------------------------------
#  Ruta por defecto hacia OPNsense
#
#  Redirige el trafico de salida hacia el firewall en lugar del
#  adaptador NAT que Vagrant impone
# -------------------------------------------------------------

- name: Retirar la unidad systemd de ruta (reemplazada por if-up.d)
  ansible.builtin.file:
    path: /etc/systemd/system/ruta-zona.service
    state: absent
  notify: recargar systemd
  tags: [base, red]

- name: Desplegar el script de ruta por defecto
  ansible.builtin.template:
    src: "ruta-zona-{{ base_ruta_metodo }}.sh.j2"
    dest: "{{ base_ruta_script }}"
    owner: root
    group: root
    mode: "0755"
  when: base_configurar_ruta_default
  tags: [base, red]

- name: Consultar la ruta por defecto vigente
  ansible.builtin.command:
    cmd: ip -4 route show default
  register: base_ruta_actual
  changed_when: false
  tags: [base, red]

# Solo actua si la ruta vigente no es ya la del gateway de zona
#
- name: Aplicar la ruta por defecto de inmediato
  ansible.builtin.command:
    cmd: "ip route replace default via {{ base_gateway }}"
  when:
    - base_configurar_ruta_default
    - base_gateway not in base_ruta_actual.stdout
  tags: [base, red]

- name: Verificar por donde sale el trafico
  ansible.builtin.command:
    cmd: ip route get 1.1.1.1
  register: base_ruta_salida
  changed_when: false
  failed_when: false
  tags: [base, red, verificacion]

- name: Mostrar la ruta de salida
  ansible.builtin.debug:
    msg: "{{ base_ruta_salida.stdout_lines | first }}"
  when: base_ruta_salida.rc == 0
  tags: [base, red, verificacion]

- name: Advertir si no hay ruta de salida
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} no tiene ruta de salida hacia Internet.
      Verificar que la interfaz de zona este activa y que existan reglas
      de filtrado para {{ base_gateway }} en OPNsense.
  when: base_ruta_salida.rc != 0
  tags: [base, red, verificacion]
