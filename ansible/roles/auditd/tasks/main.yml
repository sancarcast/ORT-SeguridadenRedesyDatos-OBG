---
# =============================================================
#  Rol auditd - tareas
# =============================================================

- name: Cargar variables de la familia de sistema operativo
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  tags: always

- name: Actualizar paquetes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  register: auditd_apt_update
  until: auditd_apt_update is succeeded
  retries: 5
  delay: 15
  tags: [auditoria, paquetes]

- name: Instalar auditd
  ansible.builtin.package:
    name: "{{ auditd_paquetes }}"
    state: present
    update_cache: "{{ true if ansible_os_family == 'Debian' else omit }}"
  tags: [auditoria, paquetes]

# -------------------------------------------------------------
#  Configuracion del daemon
# -------------------------------------------------------------

- name: Desplegar la configuracion de auditd
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: reiniciar auditd
  tags: [auditoria]

# -------------------------------------------------------------
#  Reglas
# -------------------------------------------------------------

- name: Desplegar el ruleset mapeado a MITRE ATT&CK
  ansible.builtin.template:
    src: reglas-mitre.rules.j2
    dest: /etc/audit/rules.d/50-mitre.rules
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: recargar reglas de auditd
  tags: [auditoria]

- name: Retirar los rulesets de ejemplo de la distribucion
  ansible.builtin.file:
    path: "/etc/audit/rules.d/{{ item }}"
    state: absent
  loop:
    - audit.rules
  notify: recargar reglas de auditd
  tags: [auditoria]

- name: Habilitar y arrancar auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  tags: [auditoria]

# -------------------------------------------------------------
#  Auditoria desde el arranque
# -------------------------------------------------------------

- name: Habilitar la auditoria en los parametros del nucleo
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX='
    line: 'GRUB_CMDLINE_LINUX="audit=1 audit_backlog_limit={{ auditd_backlog_limit }}"'
    state: present
    backup: true
  when: auditd_auditar_desde_arranque
  register: auditd_grub
  notify: actualizar grub
  tags: [auditoria, arranque]

- name: Advertir que hace falta reiniciar
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: los parametros de arranque cambiaron.
      La auditoria desde el arranque toma efecto tras reiniciar el host.
  when: auditd_grub.changed
  tags: [auditoria, arranque]

# -------------------------------------------------------------
#  Verificacion
# -------------------------------------------------------------

- name: Aplicar los cambios pendientes antes de verificar
  ansible.builtin.meta: flush_handlers
  tags: [auditoria]

- name: Consultar el estado del subsistema
  ansible.builtin.command:
    cmd: auditctl -s
  register: auditd_estado
  changed_when: false
  check_mode: false
  tags: [auditoria, verificacion]

- name: Contar las reglas cargadas
  ansible.builtin.shell:
    cmd: "auditctl -l | wc -l"
  register: auditd_reglas
  changed_when: false
  check_mode: false
  tags: [auditoria, verificacion]

- name: Comprobar que la auditoria esta habilitada
  ansible.builtin.assert:
    that:
      - "'enabled 1' in auditd_estado.stdout or 'enabled 2' in auditd_estado.stdout"
      - auditd_reglas.stdout | int > 20
    fail_msg: >-
      La auditoria no quedo activa en {{ inventory_hostname }}, o se
      cargaron menos reglas de las esperadas
      ({{ auditd_reglas.stdout | default('0') }}).
    success_msg: >-
      Auditoria activa con {{ auditd_reglas.stdout }} reglas cargadas.
  tags: [auditoria, verificacion]
